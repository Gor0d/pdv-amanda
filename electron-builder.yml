appId: com.pdvamanda.app
productName: Sistema de Vendas
copyright: PDV-Amanda

directories:
  output: dist
  buildResources: recursos

files:
  - src/**/*
  - package.json
  - '!**/*.map'

# O .node do better-sqlite3 não pode ficar dentro do asar: o processo precisa
# carregá-lo do disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# O better-sqlite3 13 já traz prebuilds N-API por plataforma. Deixar o
# electron-builder recompilar exigiria Visual Studio Build Tools na máquina de
# quem gera o instalador, sem nenhum ganho.
npmRebuild: false

win:
  target:
    - nsis
  # Ver docs/build-windows.md: sem o Modo de Desenvolvedor do Windows ligado, o
  # electron-builder nao consegue extrair o pacote winCodeSign (ele contem
  # symlinks de macOS) e o build para. Desligar esta etapa evita esse download.
  # Custo: o .exe sai sem icone e sem metadados de versao.
  signAndEditExecutable: false
  artifactName: ${productName} ${version} - instalador.${ext}

nsis:
  # Instalador com telas, não "um clique": a dona da loja precisa ver onde
  # está instalando e conseguir repetir o processo sozinha.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sistema de Vendas
  deleteAppDataOnUninstall: false # nunca apagar o banco da loja ao desinstalar
